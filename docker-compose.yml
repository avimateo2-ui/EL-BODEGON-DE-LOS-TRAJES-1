services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bodegon_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - ./img:/app/img:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - bodegon-net

networks:
  bodegon-net:
    driver: bridge
